<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まいにちつづぬいガチャ</title>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="titleScreen" class="container">
        <h2>まいにちつづぬいガチャ</h2>
        <img id="titleImage" src="images/title.png" alt="タイトル画像">
        <button id="startButton">ガチャを引く</button>
        <button id="tenDrawButton" class="ten-draw-button">9連ガチャ</button>
    </div>

    <div id="mainScreen" class="container" style="display: none;">
        <h2 id="titleText">まいにちつづぬいガチャ</h2>
        <button id="drawButton">ガチャを引く</button>
        <div id="imageContainer">
            <div id="cardPack"></div>
            <div id="blueCard"></div>
            <img id="resultImage" src="" alt="ガチャ結果" style="display: none;">
            <p id="captionText"></p>
            <div id="sparkleEffect" class="sparkle-effect"></div>
        </div>
        <div id="actionButtons" style="display: none;">
            <p id="shareMessage">スクショをとってシェアしてね</p>
            <button id="retryButton" class="retry-button">もう一度引く</button>
            <button id="returnButton" class="title-button">タイトルに戻る</button>
            <button id="shareButton" class="share-button">シェアする</button>
        </div>
    </div>

    <div id="imageDisplay" class="container" style="display: none;">
        <h2 id="displayTitle"></h2>
        <p id="displayCaption"></p>
        <img id="displayImage" src="" alt="表示画像">
        <div id="tenDrawShareSection" style="display: none;">
            <p class="share-message-text">スクショをとってシェアしてね</p>
            <button id="tenDrawShareButton" class="share-button">Xにシェア</button>
        </div>
        <button id="returnToTenDrawResult" class="retry-button" style="display: none;">9連結果に戻る</button>
        <button id="returnToTitle" class="title-button">タイトルに戻る</button>
    </div>

    <!-- 9連ガチャ演出画面 -->
    <div id="tenDrawScreen" class="container" style="display: none;">
        <h2 id="tenDrawTitle">9連ガチャ</h2>
        <div id="tenDrawAnimationGrid" class="ten-draw-animation-grid"></div>
        <p id="tenDrawProgress"></p>
    </div>

    <!-- 9連ガチャ結果画面 -->
    <div id="tenDrawResultScreen" class="container" style="display: none;">
        <h2>9連ガチャ結果</h2>
        <p class="ten-draw-hint">画像タップでくわしくみれるよ</p>
        <div id="tenDrawGrid" class="ten-draw-grid"></div>
        <div id="tenDrawActions">
            <button id="tenDrawRetryButton" class="retry-button">もう一度9連</button>
            <button id="tenDrawReturnButton" class="title-button">タイトルに戻る</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
